<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كاتالوج المنتجات</title>
<style>
:root{
  --ink:#12263A; --paper:#F2F6F8; --card:#FFFFFF; --teal:#0E7C7B; --teal-d:#0A5F5E;
  --amber:#F2A541; --line:#D5DEE4; --muted:#5F7385; --danger:#B3261E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,system-ui,sans-serif;
  line-height:1.6; padding-bottom:80px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* Header */
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--ink)}
body.editing header{border-bottom-color:var(--amber)}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:1.25rem;margin:0;font-weight:800;line-height:1.3}
.mode{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;flex:none}
.mode button{border:0;background:transparent;color:#fff;padding:6px 16px;border-radius:999px;font-weight:600;font-size:.9rem}
.mode button[aria-pressed="true"]{background:#fff;color:var(--ink)}
body.editing .mode button[aria-pressed="true"]{background:var(--amber)}

/* Tools */
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.search{margin:14px 0 10px;position:relative}
.search input{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

.toolbar{display:none;background:#fff;border:1.5px dashed var(--amber);border-radius:12px;padding:12px;margin:0 0 14px;gap:10px;flex-wrap:wrap;align-items:end}
body.editing .toolbar{display:flex}
.field{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1rem;background:#fff;color:var(--ink)}
.toolbar .field.grow{flex:1 1 180px}
.toolbar .field.small{width:90px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--teal);color:#fff}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger)}
.btn.danger.confirm{background:var(--danger);color:#fff}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid}
.pic{aspect-ratio:4/3;background:var(--tint,#DCEEEE);display:grid;place-items:center;font-size:3.4rem;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:1rem;line-height:1.35}
.desc{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.price-row{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:6px}
.price{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--teal-d)}
.cur{font-size:.85rem;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--teal);border-radius:10px;overflow:hidden;direction:ltr}
.stepper button{border:0;background:var(--teal);color:#fff;width:36px;font-size:1.3rem;font-weight:700;line-height:1}
.stepper input{width:100%;min-width:0;border:0;text-align:center;font-weight:800;font-size:1.15rem;padding:6px 2px;font-variant-numeric:tabular-nums;background:#fff}
.price-row.editing{flex-wrap:wrap}
.price-row.editing .stepper{flex:1 1 110px}
.edit-btn{margin-top:8px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px;font-weight:600;font-size:.85rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px}

/* Bottom actions */
.dock{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:15}
.dock .btn{flex:1;max-width:260px}

/* Dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(440px,94vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(18,38,58,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:1.15rem}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.actions .btn{flex:1}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em}
.photo-row{display:flex;align-items:center;gap:10px}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:2rem;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.note{font-size:.85rem;color:var(--muted);margin:0}
.qpic{height:34vh;max-height:300px;background:var(--paper);border-radius:12px;display:grid;place-items:center;font-size:4rem;overflow:hidden}
.qpic img{width:100%;height:100%;object-fit:contain}
.qprice{display:flex;align-items:center;gap:8px}
.qprice input{flex:1;min-width:0;font-size:1.6rem;font-weight:800;text-align:center;padding:10px}

.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  header .mode,.search,.chips,.toolbar,.dock,.edit-btn,.toast{display:none!important}
  body{background:#fff;padding:0}
  header{position:static;background:#fff;color:var(--ink);border:0}
  .grid{grid-template-columns:repeat(3,1fr)}
  .card{border:1px solid #bbb}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="title">كاتالوج المنتجات</h1>
    <div class="mode" role="group" aria-label="وضع العرض">
      <button id="mView" aria-pressed="true">عرض</button>
      <button id="mEdit" aria-pressed="false">تعديل</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="search"><input id="q" type="search" placeholder="ابحث عن منتج" aria-label="ابحث عن منتج"></div>
  <div class="chips" id="chips"></div>

  <section class="toolbar" aria-label="أدوات التعديل">
    <label class="field grow">اسم الكاتالوج<input id="shopName"></label>
    <label class="field small">العملة<input id="currency"></label>
    <button class="btn" id="bPhotos">إضافة صور متعددة</button>
    <input type="file" id="photosFile" accept="image/*" multiple hidden>
    <button class="btn ghost" id="bQuick">إدخال الأسعار بالتتابع</button>
    <button class="btn ghost" id="bAdd">إضافة منتج واحد</button>
    <button class="btn ghost" id="bBulk">تغيير الأسعار دفعة واحدة</button>
    <button class="btn ghost" id="bExport">حفظ نسخة احتياطية</button>
    <button class="btn ghost" id="bImport">استيراد نسخة</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </section>

  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<div class="dock" id="dock">
  <button class="btn" id="bWhats">مشاركة عبر واتساب</button>
  <button class="btn ghost" id="bPrint">طباعة / PDF</button>
</div>

<div class="toast" id="toast" role="status"></div>

<!-- Product dialog -->
<dialog id="dProd">
  <div class="dlg">
    <h2 id="dProdTitle">منتج</h2>
    <label class="field">اسم المنتج<input id="fName"></label>
    <div class="row">
      <label class="field">السعر<input id="fPrice" inputmode="decimal"></label>
      <label class="field">الفئة<input id="fCat" list="catList"></label>
    </div>
    <datalist id="catList"></datalist>
    <label class="field">وصف قصير<textarea id="fDesc" rows="2"></textarea></label>
    <div class="photo-row">
      <div class="thumb" id="fThumb"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <button class="btn ghost" id="fPhotoBtn">اختيار صورة</button>
        <button class="btn ghost" id="fPhotoDel">إزالة الصورة</button>
        <input type="file" id="fPhoto" accept="image/*" hidden>
      </div>
      <label class="field" style="width:80px">رمز بديل<input id="fEmoji" maxlength="4"></label>
    </div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button class="btn" id="fSave">حفظ</button>
      <button class="btn ghost" id="fCancel">إلغاء</button>
      <button class="btn danger" id="fDelete">حذف المنتج</button>
    </div>
  </div>
</dialog>

<!-- Quick pricing dialog -->
<dialog id="dQuick">
  <div class="dlg">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>إدخال الأسعار</h2><span class="note" id="qCount"></span></div>
    <div class="qpic" id="qPic"></div>
    <label class="field">السعر<div class="qprice"><input id="qPrice" inputmode="decimal" placeholder="0"><span class="cur" id="qCur"></span></div></label>
    <label class="field">اسم المنتج (اختياري)<input id="qName"></label>
    <div class="actions">
      <button class="btn ghost" id="qPrev">السابق</button>
      <button class="btn" id="qNext">حفظ والتالي</button>
    </div>
    <button class="btn ghost" id="qClose">إغلاق</button>
  </div>
</dialog>

<!-- Bulk dialog -->
<dialog id="dBulk">
  <div class="dlg">
    <h2>تغيير الأسعار دفعة واحدة</h2>
    <label class="field">على أي منتجات؟<select id="bScope"></select></label>
    <label class="field">نوع التغيير
      <select id="bAction">
        <option value="incPct">زيادة بنسبة %</option>
        <option value="decPct">تخفيض بنسبة %</option>
        <option value="incAmt">زيادة بمبلغ ثابت</option>
        <option value="decAmt">تخفيض بمبلغ ثابت</option>
      </select>
    </label>
    <label class="field">القيمة<input id="bVal" inputmode="decimal" placeholder="10"></label>
    <p class="note" id="bInfo"></p>
    <div class="actions">
      <button class="btn" id="bApply">تطبيق على الأسعار</button>
      <button class="btn ghost" id="bCancel">إلغاء</button>
    </div>
  </div>
</dialog>

<script>
(function(){
const $ = s => document.querySelector(s);
const KEY = 'product-catalog-v2';
const DEFAULT_CAT = 'منتجات';
const ALL = 'الكل';
const TINTS = ['#DCEEEE','#F9E6C8','#E3E8F6','#F6DDE0','#E4F0D8','#EBE0F3'];

const DEFAULTS = {
  shop: 'كاتالوج المنتجات',
  currency: 'ر.س',
  products: []
};

let state = JSON.parse(JSON.stringify(DEFAULTS));
let edit = false, activeCat = ALL, query = '', draft = null, delArmed = false;

/* ---------- storage (works in browsers and in the Claude app) ---------- */
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ const r = await window.storage.set(KEY, s); if(r) return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); return; }catch(e){}
  toast('تعذّر الحفظ، المساحة ممتلئة. احذف بعض الصور.');
}
async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return null;
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round(n*100)/100;
const fmt = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
function num(s){
  const t = String(s).replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[٬,\s]/g,'');
  const n = parseFloat(t); return isNaN(n)?0:n;
}
const cats = () => [...new Set(state.products.map(p=>p.cat).filter(Boolean))];
const tint = c => { const i = cats().indexOf(c); return TINTS[(i<0?0:i)%TINTS.length]; };
const uid = () => 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- render ---------- */
function visible(){
  const q = query.trim().toLowerCase();
  return state.products.filter(p =>
    (activeCat===ALL || p.cat===activeCat) &&
    (!q || (p.name+' '+p.desc+' '+p.cat).toLowerCase().includes(q)));
}
function render(){
  document.body.classList.toggle('editing', edit);
  $('#mView').setAttribute('aria-pressed', !edit);
  $('#mEdit').setAttribute('aria-pressed', edit);
  $('#title').textContent = state.shop;
  document.title = state.shop;
  if(activeCat!==ALL && !cats().includes(activeCat)) activeCat = ALL;

  const cs = [ALL, ...cats()];
  $('#chips').innerHTML = cs.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===activeCat}">${esc(c)}</button>`).join('');
  $('#catList').innerHTML = cats().map(c=>`<option value="${esc(c)}">`).join('');
  $('#chips').style.display = cs.length>2 ? '' : 'none';

  const list = visible();
  if(!list.length){
    $('#grid').innerHTML = `<div class="empty">${state.products.length ? 'لا توجد نتائج مطابقة.' : 'الكاتالوج فارغ. اضغط «تعديل» ثم «إضافة صور متعددة».'}</div>`;
    return;
  }
  $('#grid').innerHTML = list.map(p=>{
    const pic = p.img ? `<img src="${p.img}" alt="${esc(p.name)}">` : esc(p.emoji||'🛍️');
    const priceRow = edit
      ? `<div class="price-row editing">
           <div class="stepper"><button data-act="inc" aria-label="زيادة السعر">+</button>
             <input data-act="price" inputmode="decimal" value="${fmt(p.price).replace(/,/g,'')}" aria-label="سعر ${esc(p.name)}">
             <button data-act="dec" aria-label="تخفيض السعر">−</button></div>
           <span class="cur">${esc(state.currency)}</span></div>
         <button class="edit-btn" data-act="edit">تعديل المنتج</button>`
      : `<div class="price-row"><span class="price">${p.price ? fmt(p.price) : '—'}</span>${p.price ? `<span class="cur">${esc(state.currency)}</span>` : ''}</div>`;
    return `<article class="card" data-id="${p.id}">
      <div class="pic" style="--tint:${tint(p.cat)}">${pic}</div>
      <div class="body"><h3>${p.name ? esc(p.name) : (edit ? '<span style="color:var(--muted);font-weight:500">بدون اسم</span>' : '')}</h3><p class="desc">${esc(p.desc)}</p>${priceRow}</div>
    </article>`;
  }).join('');
}

/* ---------- events: grid, chips, search, mode ---------- */
$('#chips').addEventListener('click', e=>{ const b=e.target.closest('[data-cat]'); if(!b) return; activeCat=b.dataset.cat; render(); });
$('#q').addEventListener('input', e=>{ query=e.target.value; render(); });
$('#mView').onclick = ()=>{ edit=false; render(); };
$('#mEdit').onclick = ()=>{ edit=true; syncToolbar(); render(); };

$('#grid').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const card = b.closest('.card'); const p = state.products.find(x=>x.id===card.dataset.id); if(!p) return;
  const act = b.dataset.act;
  if(act==='edit') return openProduct(p.id);
  if(act==='inc' || act==='dec'){
    p.price = Math.max(0, round2(p.price + (act==='inc'?1:-1)));
    card.querySelector('input').value = p.price;
    save(); toast('تم حفظ السعر');
  }
});
$('#grid').addEventListener('change', e=>{
  if(e.target.dataset.act!=='price') return;
  const p = state.products.find(x=>x.id===e.target.closest('.card').dataset.id); if(!p) return;
  p.price = Math.max(0, round2(num(e.target.value)));
  e.target.value = p.price;
  save(); toast('تم حفظ السعر');
});

/* ---------- toolbar ---------- */
function syncToolbar(){ $('#shopName').value = state.shop; $('#currency').value = state.currency; }
$('#shopName').addEventListener('input', e=>{ state.shop = e.target.value || 'كاتالوج المنتجات'; $('#title').textContent = state.shop; document.title = state.shop; save(); });
$('#currency').addEventListener('input', e=>{ state.currency = e.target.value; save(); render(); });
$('#bAdd').onclick = ()=>openProduct(null);
$('#bBulk').onclick = openBulk;

/* ---------- product dialog ---------- */
function paintThumb(){
  $('#fThumb').innerHTML = draft.img ? `<img src="${draft.img}" alt="">` : esc(draft.emoji||'🛍️');
}
function openProduct(id){
  const p = id ? state.products.find(x=>x.id===id) : null;
  draft = p ? {...p} : {id:null, name:'', cat: activeCat!==ALL?activeCat:DEFAULT_CAT, price:0, desc:'', emoji:'🛍️', img:''};
  delArmed = false;
  $('#dProdTitle').textContent = p ? 'تعديل المنتج' : 'إضافة منتج';
  $('#fName').value = draft.name; $('#fPrice').value = draft.price || '';
  $('#fCat').value = draft.cat; $('#fDesc').value = draft.desc; $('#fEmoji').value = draft.emoji;
  $('#fErr').textContent = '';
  const d = $('#fDelete'); d.style.display = p ? '' : 'none'; d.textContent = 'حذف المنتج'; d.classList.remove('confirm');
  paintThumb();
  $('#dProd').showModal();
}
$('#fEmoji').addEventListener('input', e=>{ draft.emoji = e.target.value; paintThumb(); });
$('#fPhotoBtn').onclick = ()=>$('#fPhoto').click();
$('#fPhotoDel').onclick = ()=>{ draft.img=''; paintThumb(); };
function resizeFile(f, max=420){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onerror = rej;
    r.onload = ()=>{
      const im = new Image();
      im.onerror = rej;
      im.onload = ()=>{
        const k = Math.min(1, max/Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.75));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
}
$('#fPhoto').addEventListener('change', async e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ draft.img = await resizeFile(f); paintThumb(); }catch(err){ toast('تعذّر قراءة الصورة'); }
});
$('#fCancel').onclick = ()=>$('#dProd').close();
$('#fSave').onclick = ()=>{
  const name = $('#fName').value.trim();
  if(!name){ $('#fErr').textContent = 'اكتب اسم المنتج أولاً.'; $('#fName').focus(); return; }
  draft.name = name; draft.price = Math.max(0, round2(num($('#fPrice').value)));
  draft.cat = $('#fCat').value.trim(); draft.desc = $('#fDesc').value.trim(); draft.emoji = $('#fEmoji').value.trim() || '🛍️';
  if(draft.id){ const i = state.products.findIndex(x=>x.id===draft.id); state.products[i] = draft; }
  else { draft.id = uid(); state.products.push(draft); }
  save(); $('#dProd').close(); render(); toast('تم حفظ المنتج');
};
$('#fDelete').onclick = ()=>{
  const d = $('#fDelete');
  if(!delArmed){ delArmed = true; d.textContent = 'تأكيد الحذف'; d.classList.add('confirm'); return; }
  state.products = state.products.filter(x=>x.id!==draft.id);
  save(); $('#dProd').close(); render(); toast('تم حذف المنتج');
};

/* ---------- bulk price change ---------- */
function openBulk(){
  $('#bScope').innerHTML = `<option value="${ALL}">كل المنتجات</option>` + cats().map(c=>`<option value="${esc(c)}">فئة: ${esc(c)}</option>`).join('');
  $('#bVal').value = ''; bulkInfo();
  $('#dBulk').showModal();
}
function bulkTargets(){ const s=$('#bScope').value; return state.products.filter(p=>s===ALL||p.cat===s); }
function bulkNew(p){
  const v = num($('#bVal').value), a = $('#bAction').value;
  let n = p.price;
  if(a==='incPct') n = p.price*(1+v/100);
  if(a==='decPct') n = p.price*(1-v/100);
  if(a==='incAmt') n = p.price+v;
  if(a==='decAmt') n = p.price-v;
  return Math.max(0, round2(n));
}
function bulkInfo(){
  const t = bulkTargets();
  if(!t.length){ $('#bInfo').textContent = 'لا توجد منتجات في هذا الاختيار.'; return; }
  const p = t[0];
  $('#bInfo').textContent = `سيتغير سعر ${t.length} منتج. مثال: ${p.name} من ${fmt(p.price)} إلى ${fmt(bulkNew(p))} ${state.currency}.`;
}
['#bScope','#bAction'].forEach(s=>$(s).addEventListener('change', bulkInfo));
$('#bVal').addEventListener('input', bulkInfo);
$('#bCancel').onclick = ()=>$('#dBulk').close();
$('#bApply').onclick = ()=>{
  if(!num($('#bVal').value)){ $('#bInfo').textContent = 'اكتب قيمة التغيير أولاً.'; return; }
  const t = bulkTargets(); t.forEach(p=>{ p.price = bulkNew(p); });
  save(); $('#dBulk').close(); render(); toast(`تم تحديث أسعار ${t.length} منتج`);
};

/* ---------- many photos + quick pricing ---------- */
$('#bPhotos').onclick = ()=>$('#photosFile').click();
$('#photosFile').addEventListener('change', async e=>{
  const files = [...e.target.files]; e.target.value=''; if(!files.length) return;
  toast('جارٍ تجهيز '+files.length+' صورة...');
  const ids = []; let failed = 0;
  for(const f of files){
    try{
      const img = await resizeFile(f); const id = uid();
      state.products.push({id, name:'', cat:DEFAULT_CAT, price:0, desc:'', emoji:'🛍️', img}); ids.push(id);
    }catch(err){ failed++; }
  }
  await save(); render();
  if(ids.length) openQuick(ids);
  if(failed) toast('تعذّر قراءة '+failed+' صورة');
});
let qq = [], qi = 0;
const byId = id => state.products.find(x=>x.id===id);
function openQuick(ids){ qq = ids; qi = 0; showQ(); if(!$('#dQuick').open) $('#dQuick').showModal(); }
function showQ(){
  const p = byId(qq[qi]); if(!p) return;
  $('#qPic').innerHTML = p.img ? `<img src="${p.img}" alt="">` : esc(p.emoji||'🛍️');
  $('#qCount').textContent = (qi+1)+' من '+qq.length;
  $('#qName').value = p.name; $('#qPrice').value = p.price || '';
  $('#qCur').textContent = state.currency;
  $('#qPrev').disabled = qi===0;
  $('#qNext').textContent = qi===qq.length-1 ? 'حفظ وإنهاء' : 'حفظ والتالي';
  setTimeout(()=>$('#qPrice').focus(), 50);
}
function saveQ(){
  const p = byId(qq[qi]); if(!p) return;
  p.name = $('#qName').value.trim(); p.price = Math.max(0, round2(num($('#qPrice').value))); save();
}
$('#qNext').onclick = ()=>{ saveQ(); if(qi>=qq.length-1){ $('#dQuick').close(); toast('تم حفظ الأسعار'); } else { qi++; showQ(); } };
$('#qPrev').onclick = ()=>{ saveQ(); if(qi>0){ qi--; showQ(); } };
$('#qClose').onclick = ()=>{ saveQ(); $('#dQuick').close(); };
$('#qPrice').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#qNext').click(); } });
$('#qName').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#qPrice').focus(); } });
$('#dQuick').addEventListener('cancel', saveQ);
$('#dQuick').addEventListener('close', render);
$('#bQuick').onclick = ()=>{
  const ids = state.products.filter(p=>!p.price).map(p=>p.id);
  if(!ids.length) return toast('كل المنتجات لها أسعار');
  openQuick(ids);
};

/* ---------- backup ---------- */
$('#bExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'catalog-backup.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('تم تجهيز النسخة الاحتياطية');
};
$('#bImport').onclick = ()=>$('#importFile').click();
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.products)) throw 0;
      state = {shop:d.shop||DEFAULTS.shop, currency:d.currency||DEFAULTS.currency, products:d.products};
      save(); syncToolbar(); render(); toast('تم استيراد الكاتالوج');
    }catch(err){ toast('الملف غير صالح'); }
  };
  r.readAsText(f); e.target.value='';
});

/* ---------- share ---------- */
$('#bWhats').onclick = ()=>{
  const list = visible(); if(!list.length) return toast('لا توجد منتجات للمشاركة');
  const by = {}; list.forEach(p=>{ (by[p.cat||'أخرى'] = by[p.cat||'أخرى'] || []).push(p); });
  let t = `*${state.shop}*\n`;
  Object.keys(by).forEach(c=>{
    t += `\n*${c}*\n`;
    by[c].forEach(p=>{ t += `• ${p.name}: ${fmt(p.price)} ${state.currency}\n`; });
  });
  window.open('https://wa.me/?text='+encodeURIComponent(t), '_blank');
};
$('#bPrint').onclick = ()=>window.print();

/* ---------- start ---------- */
load().then(s=>{
  if(s && Array.isArray(s.products)) state = {shop:s.shop||DEFAULTS.shop, currency:s.currency||DEFAULTS.currency, products:s.products};
  syncToolbar(); render();
});
})();
</script>
</body>
</html>
